[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policyengine-bundles"
version = "0.0.0"
description = "Immutable PolicyEngine bundle manifests, locks, constraints, and validation reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.22",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
