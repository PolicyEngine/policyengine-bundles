name: Publish bundle

on:
  push:
    branches: [main]
    paths:
      - candidates/**
  workflow_dispatch:
    inputs:
      bundle_version:
        description: "Optional bundle candidate version. Defaults to latest candidate."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      POLICYENGINE_PY_REPO: PolicyEngine/policyengine.py
      POLICYENGINE_PY_BASE_BRANCH: main
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: PolicyEngine
          repositories: |
            policyengine-bundles
            policyengine.py

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install bundle tooling
        run: python -m pip install --upgrade -e ".[dev]"

      - name: Confirm private data access is configured
        run: test -n "$HUGGING_FACE_TOKEN"

      - name: Select bundle to publish
        id: bundle
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_BUNDLE_VERSION: ${{ github.event.inputs.bundle_version || '' }}
        run: python scripts/select_bundle_to_publish.py

      - name: Generate and validate bundle from candidate
        if: ${{ steps.bundle.outputs.should_publish == 'true' }}
        run: python scripts/generate_validate_committed_bundle.py --candidate "${{ steps.bundle.outputs.candidate }}" --output "${{ steps.bundle.outputs.generated_bundle }}"

      - name: Package release assets
        if: ${{ steps.bundle.outputs.should_publish == 'true' }}
        run: |
          python scripts/package_bundle_release.py \
            "${{ steps.bundle.outputs.generated_bundle }}" \
            --output-dir .tmp/dist

      - name: Check existing bundle release
        id: release
        if: ${{ steps.bundle.outputs.should_publish == 'true' }}
        env:
          BUNDLE_VERSION: ${{ steps.bundle.outputs.bundle_version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/check_existing_bundle_release.py --bundle-version "$BUNDLE_VERSION" --dist-dir .tmp/dist --repo "$GITHUB_REPOSITORY"

      - name: Publish immutable bundle release assets
        if: ${{ steps.bundle.outputs.should_publish == 'true' && steps.release.outputs.exists != 'true' }}
        env:
          BUNDLE_VERSION: ${{ steps.bundle.outputs.bundle_version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/publish_bundle_release_assets.py "$BUNDLE_VERSION" --dist-dir .tmp/dist --target-sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"

      - name: Check policyengine.py consuming PR support
        id: policyengine-py-consumer
        if: ${{ steps.bundle.outputs.should_publish == 'true' }}
        env:
          BUNDLE_VERSION: ${{ steps.bundle.outputs.bundle_version }}
        run: python scripts/should_open_policyengine_py_consuming_pr.py "$BUNDLE_VERSION" --dist-dir .tmp/dist

      - uses: actions/checkout@v4
        if: ${{ steps.policyengine-py-consumer.outputs.should_open == 'true' }}
        with:
          repository: ${{ env.POLICYENGINE_PY_REPO }}
          ref: ${{ env.POLICYENGINE_PY_BASE_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          path: policyengine.py

      - name: Open policyengine.py consuming PR
        if: ${{ steps.policyengine-py-consumer.outputs.should_open == 'true' }}
        env:
          BUNDLE_VERSION: ${{ steps.bundle.outputs.bundle_version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/open_policyengine_py_consuming_pr.sh
