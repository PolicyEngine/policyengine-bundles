name: Validate bundles

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install validation tooling
        run: python -m pip install --upgrade -e ".[dev]"
      - name: Validate schemas and example manifests
        run: python scripts/validate_schemas.py
      - name: Validate typed models
        run: python scripts/validate_models.py
      - name: Run tests
        run: pytest
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  certify-live-4-4-3:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install validation tooling
        run: python -m pip install --upgrade -e ".[dev]"
      - name: Confirm private data access is configured
        run: test -n "$HUGGING_FACE_TOKEN"
      - name: Create work directory
        run: mkdir -p .tmp
      - name: Generate bundle
        run: |
          python scripts/generate_bundle.py \
            --input candidates/4.4.3-all.json \
            --output .tmp/bundle-4.4.3
      - name: Solve lockfiles
        run: python scripts/solve_lockfiles.py .tmp/bundle-4.4.3
      - name: Validate bundle
        run: python scripts/validate_bundle.py .tmp/bundle-4.4.3
      - name: Compare regenerated bundle to committed bundle
        run: python scripts/compare_bundle_directories.py bundles/4.4.3 .tmp/bundle-4.4.3
      - uses: actions/upload-artifact@v4
        with:
          name: policyengine-bundle-4.4.3-all
          path: .tmp/bundle-4.4.3
