name: Validate bundles

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install validation tooling
        run: python -m pip install --upgrade -e ".[dev]"
      - name: Validate schemas and example manifests
        run: python scripts/validate_schemas.py
      - name: Validate typed models
        run: python scripts/validate_models.py
      - name: Run tests
        run: pytest
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  certify-live-4-4-3:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install validation tooling
        run: python -m pip install --upgrade -e ".[dev]"
      - name: Confirm private data access is configured
        run: test -n "$HUGGING_FACE_TOKEN"
      - name: Create work directory
        run: mkdir -p .tmp
      - name: Generate bundle
        run: |
          python scripts/generate_bundle.py \
            --input candidates/4.4.3-all.json \
            --output .tmp/bundle-4.4.3
      - name: Solve lockfiles
        run: python scripts/solve_lockfiles.py .tmp/bundle-4.4.3
      - name: Validate bundle
        run: python scripts/validate_bundle.py .tmp/bundle-4.4.3 --skip-data-verification
      - name: Verify default US data artifact
        run: |
          python - <<'PY'
          from policyengine_bundles.bundle_validation import verify_artifact_uri

          uri = "hf://model/policyengine/policyengine-us-data@1.110.12/enhanced_cps_2024.h5"
          expected_sha256 = "58a6639f7511b8d804701417e2647f0c3a77f51a3d90441037eaf004b1f00761"
          expected_size = 109844730
          actual = verify_artifact_uri(uri)
          assert actual.sha256 == expected_sha256, actual
          assert actual.size_bytes == expected_size, actual
          print(f"default US data artifact ok: {uri}")
          PY
      - name: Compare regenerated bundle to committed bundle
        run: python scripts/compare_bundle_directories.py bundles/4.4.3 .tmp/bundle-4.4.3
      - uses: actions/upload-artifact@v4
        with:
          name: policyengine-bundle-4.4.3-all
          path: .tmp/bundle-4.4.3
